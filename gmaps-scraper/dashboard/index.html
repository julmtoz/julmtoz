<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeadScraper Pro – Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- ========== HEADER ========================================= -->
<header class="header">
  <div class="header-left">
    <div class="logo">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
        <circle cx="14" cy="14" r="14" fill="#4F46E5"/>
        <path d="M8 14C8 10.7 10.7 8 14 8s6 2.7 6 6c0 4-6 12-6 12S8 18 8 14z" fill="white"/>
        <circle cx="14" cy="13.5" r="2.5" fill="#4F46E5"/>
      </svg>
      <span class="logo-text">LeadScraper <span class="pro">Pro</span></span>
    </div>
  </div>
  <div class="header-center">
    <div class="status-badge" id="statusBadge">
      <span class="status-dot idle"></span>
      <span id="statusText">Ready</span>
    </div>
  </div>
  <div class="header-right">
    <button class="btn btn-ghost" id="btnSettings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Settings
    </button>
  </div>
</header>

<!-- ========== MAIN LAYOUT ==================================== -->
<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">

    <!-- Scraping Form -->
    <div class="card form-card">
      <h2 class="card-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        Search Setup
      </h2>

      <label class="field-label">Keywords <span class="hint">(one per line)</span></label>
      <textarea id="keywords" class="textarea" placeholder="plumbers near me&#10;dentists&#10;lawyers in Miami" rows="5"></textarea>

      <label class="field-label">Location</label>
      <input id="location" type="text" class="input" placeholder="New York, NY" />

      <div class="toggle-row">
        <label class="toggle-label">
          <input type="checkbox" id="scrapeWebsite" checked />
          <span class="toggle-track"></span>
          <span>Enrich from websites</span>
        </label>
      </div>

      <div class="toggle-row">
        <label class="toggle-label">
          <input type="checkbox" id="skipDuplicates" checked />
          <span class="toggle-track"></span>
          <span>Skip duplicates</span>
        </label>
      </div>

      <div class="btn-group">
        <button class="btn btn-primary btn-full" id="btnStart">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
          Start Scraping
        </button>
        <button class="btn btn-danger btn-full" id="btnStop" disabled>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12"/></svg>
          Stop
        </button>
      </div>
    </div>

    <!-- Progress -->
    <div class="card" id="progressCard">
      <h2 class="card-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Progress
      </h2>

      <div class="progress-keyword" id="progressKeyword">
        <span class="prog-label">Keyword</span>
        <span class="prog-value" id="currentKeyword">—</span>
        <div class="progress-bar-wrap">
          <div class="progress-bar" id="keywordProgress" style="width:0%"></div>
        </div>
        <span class="prog-sub" id="keywordSub">0 / 0</span>
      </div>

      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-val" id="statTotal">0</div>
          <div class="stat-label">Total Leads</div>
        </div>
        <div class="stat-box">
          <div class="stat-val accent" id="statUnique">0</div>
          <div class="stat-label">Unique</div>
        </div>
        <div class="stat-box">
          <div class="stat-val green" id="statEmails">0</div>
          <div class="stat-label">Emails</div>
        </div>
        <div class="stat-box">
          <div class="stat-val blue" id="statPhones">0</div>
          <div class="stat-label">Phones</div>
        </div>
      </div>

      <div class="time-row">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span id="elapsedTime">00:00:00</span>
      </div>
    </div>

    <!-- Export -->
    <div class="card">
      <h2 class="card-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export
      </h2>
      <div class="btn-group">
        <button class="btn btn-success btn-full" id="btnExportCSV">Export CSV</button>
        <button class="btn btn-outline btn-full" id="btnExportXLSX">Export Excel</button>
        <button class="btn btn-ghost btn-full" id="btnClearLeads">Clear All Leads</button>
      </div>
    </div>

  </aside>

  <!-- MAIN CONTENT -->
  <main class="main">

    <!-- Filter bar -->
    <div class="filter-bar">
      <div class="search-wrap">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="filterSearch" class="input search-input" placeholder="Filter leads..." />
      </div>
      <select id="filterCol" class="select">
        <option value="">All columns</option>
        <option value="name">Name</option>
        <option value="city">City</option>
        <option value="state">State</option>
        <option value="firstCategory">Category</option>
        <option value="domain">Domain</option>
      </select>
      <div class="filter-info">
        <span id="filterCount">0</span> leads
      </div>
      <button class="btn btn-ghost btn-sm" id="btnColumnToggle">Columns</button>
    </div>

    <!-- Columns panel -->
    <div class="columns-panel hidden" id="columnsPanel">
      <div class="columns-groups" id="columnsGroups"></div>
      <button class="btn btn-ghost btn-sm" id="btnSelectAll">Select All</button>
      <button class="btn btn-ghost btn-sm" id="btnSelectNone">Select None</button>
    </div>

    <!-- Table wrapper -->
    <div class="table-wrap" id="tableWrap">
      <table class="data-table" id="dataTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div class="empty-state" id="emptyState">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <p>No leads yet. Set up keywords and click <strong>Start Scraping</strong>.</p>
      </div>
    </div>

  </main>
</div>

<!-- ========== SETTINGS MODAL ================================= -->
<div class="modal-overlay hidden" id="settingsModal">
  <div class="modal">
    <div class="modal-header">
      <h2>Settings</h2>
      <button class="btn-close" id="btnCloseSettings">✕</button>
    </div>
    <div class="modal-body">
      <label class="field-label">Delay between listings (ms)</label>
      <input type="number" id="settingDelay" class="input" value="1500" min="500" max="10000" />

      <label class="field-label">Max listings per keyword</label>
      <input type="number" id="settingMaxListings" class="input" value="100" min="1" max="500" />

      <label class="field-label">Website enrichment timeout (ms)</label>
      <input type="number" id="settingWebTimeout" class="input" value="4000" min="1000" max="15000" />
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" id="btnSaveSettings">Save Settings</button>
    </div>
  </div>
</div>

<!-- SheetJS for Excel export -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
