<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    :root {
      --bg: #0F1117;
      --bg2: #1A1D27;
      --border: #2E3148;
      --text: #E8EAF0;
      --text2: #9CA3BF;
      --accent: #4F46E5;
      --green: #10B981;
      --red: #EF4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 240px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      padding: 0;
    }
    .header {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-icon {
      width: 28px; height: 28px;
      background: var(--accent);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    .logo-text { font-weight: 700; font-size: 14px; }
    .pro { color: var(--accent); }

    .body { padding: 12px; display: flex; flex-direction: column; gap: 8px; }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .dot.idle { background: #6B7280; }
    .dot.running { background: var(--green); animation: pulse 1.5s infinite; }
    .dot.done { background: #3B82F6; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }

    .stat-mini {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .stat-item {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px;
      text-align: center;
    }
    .stat-num { font-size: 18px; font-weight: 700; color: var(--accent); }
    .stat-lbl { font-size: 10px; color: var(--text2); margin-top: 1px; }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      width: 100%;
      transition: background 0.15s;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover:not(:disabled) { background: #6366F1; }
    .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-outline:hover:not(:disabled) { background: var(--bg2); }
    .btn-danger { background: var(--red); color: white; }
    .btn-danger:hover:not(:disabled) { background: #DC2626; }

    .footer {
      padding: 8px 12px;
      border-top: 1px solid var(--border);
      font-size: 10px;
      color: var(--text2);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-icon">📍</div>
    <div>
      <div class="logo-text">LeadScraper <span class="pro">Pro</span></div>
    </div>
  </div>

  <div class="body">
    <div class="status-row">
      <div class="dot idle" id="statusDot"></div>
      <span id="statusLabel">Ready</span>
    </div>

    <div class="stat-mini">
      <div class="stat-item">
        <div class="stat-num" id="pTotal">0</div>
        <div class="stat-lbl">Total Leads</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="pEmails">0</div>
        <div class="stat-lbl">Emails</div>
      </div>
    </div>

    <button class="btn btn-primary" id="btnOpenDash">
      Open Dashboard
    </button>
    <button class="btn btn-outline" id="btnStopPop" style="display:none">
      Stop Scraping
    </button>
  </div>

  <div class="footer">v1.0.0 · LeadScraper Pro</div>

  <script src="popup.js"></script>
</body>
</html>
